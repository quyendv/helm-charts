suite: external secrets
templates:
  - templates/cronjob.yaml
  - templates/externalsecret-s3.yaml
  - templates/externalsecret-target.yaml
set:
  schedule: "0 2 * * *"
  s3:
    prefix: backups/app
    keepRemote: 30
    externalSecret:
      enabled: true
      secretStoreRef: {name: store}
      remoteKey: secret/backup/s3
tests:
  # --- S3 ----------------------------------------------------------------------
  - it: maps every property of the remote key into the S3 Secret
    template: templates/externalsecret-s3.yaml
    asserts:
      - isKind:
          of: ExternalSecret
      - isAPIVersion:
          of: external-secrets.io/v1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-platform-backup-s3
      - equal:
          path: spec.refreshInterval
          value: 1h
      - equal:
          path: spec.secretStoreRef
          value: {kind: ClusterSecretStore, name: store}
      - equal:
          path: spec.target
          value: {name: RELEASE-NAME-platform-backup-s3, creationPolicy: Owner, deletionPolicy: Retain}
      - equal:
          path: spec.data
          value:
            - {secretKey: AWS_ACCESS_KEY_ID, remoteRef: {key: secret/backup/s3, property: AWS_ACCESS_KEY_ID}}
            - {secretKey: AWS_ENDPOINT_URL_S3, remoteRef: {key: secret/backup/s3, property: AWS_ENDPOINT_URL_S3}}
            - {secretKey: AWS_REGION, remoteRef: {key: secret/backup/s3, property: AWS_REGION}}
            - {secretKey: AWS_SECRET_ACCESS_KEY, remoteRef: {key: secret/backup/s3, property: AWS_SECRET_ACCESS_KEY}}
            - {secretKey: S3_BUCKET, remoteRef: {key: secret/backup/s3, property: S3_BUCKET}}
  - it: renames properties and drops the ones set to null
    template: templates/externalsecret-s3.yaml
    set:
      s3.externalSecret.properties:
        AWS_ACCESS_KEY_ID: access_key
        AWS_SECRET_ACCESS_KEY: secret_key
        AWS_ENDPOINT_URL_S3: null
        AWS_REGION: region
        S3_BUCKET: bucket
    asserts:
      - equal:
          path: spec.data
          value:
            - {secretKey: AWS_ACCESS_KEY_ID, remoteRef: {key: secret/backup/s3, property: access_key}}
            - {secretKey: AWS_REGION, remoteRef: {key: secret/backup/s3, property: region}}
            - {secretKey: AWS_SECRET_ACCESS_KEY, remoteRef: {key: secret/backup/s3, property: secret_key}}
            - {secretKey: S3_BUCKET, remoteRef: {key: secret/backup/s3, property: bucket}}
  - it: is not rendered when an existing Secret holds the S3 settings
    template: templates/externalsecret-s3.yaml
    set:
      s3.externalSecret.enabled: false
      s3.existingSecret: backup-s3
    asserts:
      - hasDocuments:
          count: 0
  - it: refuses an existing Secret and an ExternalSecret for S3 at once
    template: templates/cronjob.yaml
    set:
      s3.existingSecret: backup-s3
    asserts:
      - failedTemplate:
          errorPattern: "s3.existingSecret and s3.externalSecret.enabled are mutually exclusive"
  - it: requires a remote key
    template: templates/cronjob.yaml
    set:
      s3.externalSecret.remoteKey: ""
    asserts:
      - failedTemplate:
          errorPattern: "s3.externalSecret.remoteKey is required"
  - it: requires a secret store
    template: templates/cronjob.yaml
    set:
      s3.externalSecret.secretStoreRef.name: ""
    asserts:
      - failedTemplate:
          errorPattern: "s3.externalSecret.secretStoreRef.name is required"

  # --- target ------------------------------------------------------------------
  - it: is not rendered when the target needs no credentials
    template: templates/externalsecret-target.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: passes data, dataFrom and template through to the target Secret
    template: templates/externalsecret-target.yaml
    set:
      target.externalSecret:
        enabled: true
        refreshInterval: 15m
        secretStoreRef: {kind: SecretStore, name: app-store}
        data:
          - secretKey: POSTGRES_PASSWORD
            remoteRef: {key: secret/app/db, property: password}
        dataFrom:
          - extract: {key: secret/app/db-coordinates}
        template:
          data:
            MONGODB_URI: "mongodb://{{ .user }}:{{ .password }}@app-mongodb:27017/app"
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-platform-backup-target
      - equal:
          path: spec.refreshInterval
          value: 15m
      - equal:
          path: spec.secretStoreRef
          value: {kind: SecretStore, name: app-store}
      - equal:
          path: spec.target.name
          value: RELEASE-NAME-platform-backup-target
      - equal:
          path: spec.target.creationPolicy
          value: Owner
      - equal:
          path: spec.target.deletionPolicy
          value: Retain
      - equal:
          path: spec.target.template
          value:
            data:
              MONGODB_URI: "mongodb://{{ .user }}:{{ .password }}@app-mongodb:27017/app"
      - equal:
          path: spec.data
          value:
            - secretKey: POSTGRES_PASSWORD
              remoteRef: {key: secret/app/db, property: password}
      - equal:
          path: spec.dataFrom
          value:
            - extract: {key: secret/app/db-coordinates}
  - it: leaves out what is not set
    template: templates/externalsecret-target.yaml
    set:
      target.externalSecret: {enabled: true, secretStoreRef: {name: store}, dataFrom: [{extract: {key: secret/app/db}}]}
    asserts:
      - notExists:
          path: spec.data
      - notExists:
          path: spec.target.template
  - it: is not rendered with an existing target Secret
    template: templates/externalsecret-target.yaml
    set:
      target.existingSecret: app-db-credentials
    asserts:
      - hasDocuments:
          count: 0
  - it: refuses an existing Secret and an ExternalSecret for the target at once
    template: templates/cronjob.yaml
    set:
      target.existingSecret: app-db-credentials
      target.externalSecret: {enabled: true, secretStoreRef: {name: store}, dataFrom: [{extract: {key: secret/app/db}}]}
    asserts:
      - failedTemplate:
          errorPattern: "target.existingSecret and target.externalSecret.enabled are mutually exclusive"
  - it: refuses a target ExternalSecret with nothing to fetch
    template: templates/cronjob.yaml
    set:
      target.externalSecret: {enabled: true, secretStoreRef: {name: store}}
    asserts:
      - failedTemplate:
          errorPattern: "target.externalSecret needs data or dataFrom"
