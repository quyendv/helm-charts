{{- include "platform-backup.validate" . }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "platform-backup.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "platform-backup.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule | quote }}
  {{- with .Values.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  suspend: {{ .Values.suspend }}
  concurrencyPolicy: {{ .Values.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.job.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.job.failedJobsHistoryLimit }}
  jobTemplate:
    metadata:
      labels: {{- include "platform-backup.podLabels" . | nindent 8 }}
    spec:
      backoffLimit: {{ .Values.job.backoffLimit }}
      {{- if not (kindIs "invalid" .Values.job.activeDeadlineSeconds) }}
      activeDeadlineSeconds: {{ .Values.job.activeDeadlineSeconds }}
      {{- end }}
      {{- if not (kindIs "invalid" .Values.job.ttlSecondsAfterFinished) }}
      ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
      {{- end }}
      template:
        metadata:
          labels: {{- include "platform-backup.podLabels" . | nindent 12 }}
          {{- with .Values.podAnnotations }}
          annotations: {{- toYaml . | nindent 12 }}
          {{- end }}
        spec:
          restartPolicy: Never
          {{- with .Values.serviceAccountName }}
          serviceAccountName: {{ . }}
          {{- end }}
          automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- range . }}
            - name: {{ . }}
            {{- end }}
          {{- end }}
          {{- with .Values.podSecurityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with include "platform-backup.affinity" . }}
          affinity: {{- . | nindent 12 }}
          {{- end }}
          containers:
            - name: backup
              image: {{ include "platform-backup.image" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              env:
                {{- include "platform-backup.managedEnv" . | nindent 16 }}
                {{- $env := .Values.env | default dict }}
                {{- range $name := keys $env | sortAlpha }}
                - name: {{ $name }}
                  value: {{ get $env $name | toString | quote }}
                {{- end }}
                {{- with .Values.extraEnv }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              {{- with include "platform-backup.envFrom" . }}
              envFrom: {{- . | trim | nindent 16 }}
              {{- end }}
              {{- with .Values.securityContext }}
              securityContext: {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with .Values.resources }}
              resources: {{- toYaml . | nindent 16 }}
              {{- end }}
              volumeMounts:
                - name: backup
                  mountPath: /backup
                {{- if .Values.fileStore.enabled }}
                - name: data
                  mountPath: {{ .Values.fileStore.mountPath }}
                  {{- if .Values.fileStore.readOnly }}
                  readOnly: true
                  {{- end }}
                {{- end }}
                {{- with .Values.extraVolumeMounts }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
          volumes:
            # Scratch for one run: KEEP_REMOTE is what retains history.
            - name: backup
              emptyDir:
                {{- with .Values.scratch.sizeLimit }}
                sizeLimit: {{ . }}
                {{- end }}
            {{- if .Values.fileStore.enabled }}
            - name: data
              persistentVolumeClaim:
                claimName: {{ .Values.fileStore.claimName }}
                {{- if .Values.fileStore.readOnly }}
                readOnly: true
                {{- end }}
            {{- end }}
            {{- with .Values.extraVolumes }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
