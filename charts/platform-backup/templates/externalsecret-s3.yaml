{{- if .Values.s3.externalSecret.enabled }}
{{- $es := .Values.s3.externalSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "platform-backup.s3SecretName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "platform-backup.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ $es.secretStoreRef.name | quote }}
  target:
    name: {{ include "platform-backup.s3SecretName" . }}
    creationPolicy: Owner
    # Keep the last delivered Secret when this object goes away.
    deletionPolicy: Retain
  data: {{- include "platform-backup.s3Properties" . | trim | nindent 4 }}
{{- end }}
