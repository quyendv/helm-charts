{{- if .Values.target.externalSecret.enabled }}
{{- $es := .Values.target.externalSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "platform-backup.targetSecretName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "platform-backup.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ $es.secretStoreRef.name | quote }}
  target:
    name: {{ include "platform-backup.targetSecretName" . }}
    creationPolicy: Owner
    # Keep the last delivered Secret when this object goes away.
    deletionPolicy: Retain
    {{- with $es.template }}
    template: {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- with $es.data }}
  data: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $es.dataFrom }}
  dataFrom: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
