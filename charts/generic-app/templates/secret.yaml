{{- if .Values.secrets.enabled }}
{{- if and .Values.externalSecret.enabled (eq (default (include "generic-app.fullname" .) .Values.externalSecret.target.name) (include "generic-app.fullname" .)) }}
{{- fail "secrets.enabled and externalSecret.enabled would both manage the Secret named after the release: set externalSecret.target.name to a different name, or use only one of them" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "generic-app.fullname" . }}
  namespace: {{ include "generic-app.namespace" . | quote }}
  labels: {{- include "generic-app.labels" . | nindent 4 }}
  {{- with include "generic-app.annotations" (dict "annotations" .Values.secrets.annotations "context" $) }}
  annotations: {{- . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- range $key, $value := .Values.secrets.data }}
  {{- /* toYaml keeps large and whole numbers as written (toString gives 1.23e+11). */}}
  {{ $key }}: {{ ternary $value (toYaml $value) (kindIs "string" $value) | b64enc | quote }}
  {{- end }}
{{- end }}

