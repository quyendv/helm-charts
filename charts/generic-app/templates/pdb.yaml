{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "generic-app.fullname" . }}
  namespace: {{ include "generic-app.namespace" . | quote }}
  labels: {{- include "generic-app.labels" . | nindent 4 }}
  {{- with include "generic-app.annotations" (dict "context" $) }}
  annotations: {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- /* The API accepts only one of the two; maxUnavailable wins so it can be set without clearing the minAvailable default. */}}
  {{- if include "generic-app.isSet" .Values.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- else if include "generic-app.isSet" .Values.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- end }}
  selector:
    matchLabels: {{- include "generic-app.selectorLabels" . | nindent 6 }}
{{- end }}

