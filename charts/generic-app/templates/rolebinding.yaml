{{- if .Values.rbac.create }}
{{- if and (not .Values.serviceAccount.create) (not .Values.serviceAccount.name) }}
{{- fail "rbac.create would bind the Role to the namespace's \"default\" ServiceAccount: set serviceAccount.create=true or name an existing account in serviceAccount.name" }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "generic-app.fullname" . }}
  namespace: {{ include "generic-app.namespace" . | quote }}
  labels: {{- include "generic-app.labels" . | nindent 4 }}
  {{- with include "generic-app.annotations" (dict "context" $) }}
  annotations: {{- . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "generic-app.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "generic-app.serviceAccountName" . }}
    namespace: {{ include "generic-app.namespace" . | quote }}
{{- end }}

