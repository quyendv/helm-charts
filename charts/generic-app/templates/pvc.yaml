{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) (ne .Values.kind "StatefulSet") }}
{{- $annotations := .Values.persistence.annotations | default dict | deepCopy }}
{{- with .Values.persistence.resourcePolicy }}
{{- $_ := set $annotations "helm.sh/resource-policy" . }}
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "generic-app.fullname" . }}
  namespace: {{ include "generic-app.namespace" . | quote }}
  labels: {{- include "generic-app.labels" . | nindent 4 }}
  {{- with include "generic-app.annotations" (dict "annotations" $annotations "context" $) }}
  annotations: {{- . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
  {{- range .Values.persistence.accessModes }}
    - {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
  {{- with include "generic-app.storageClass" . }}
  {{ . }}
  {{- end }}
  {{- with .Values.persistence.selector }}
  selector: {{- include "generic-app.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
  {{- with .Values.persistence.dataSource }}
  dataSource: {{- include "generic-app.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
{{- end }}
