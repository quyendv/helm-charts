{{- if .Values.ingress.enabled }}
{{- if not .Values.service.enabled }}
{{- fail "service.enabled must be true when ingress.enabled is true (the Ingress routes to the chart Service)" }}
{{- end }}
{{- if and .Values.ingress.tls (not .Values.ingress.hostname) }}
{{- fail "ingress.tls requires ingress.hostname (the TLS secret and hosts are derived from it)" }}
{{- end }}
{{- if not (or .Values.ingress.hostname .Values.ingress.extraHosts .Values.ingress.extraRules) }}
{{- fail "ingress.enabled is true but the Ingress has no rules: set ingress.hostname, ingress.extraHosts or ingress.extraRules" }}
{{- end }}
{{- $portName := "" }}
{{- if or .Values.ingress.hostname .Values.ingress.extraHosts }}
{{- $portName = include "generic-app.service.portName" (dict "port" .Values.ingress.servicePort "field" "ingress.servicePort" "context" $) }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "generic-app.fullname" . }}
  namespace: {{ include "generic-app.namespace" . | quote }}
  labels: {{- include "generic-app.labels" . | nindent 4 }}
  {{- with include "generic-app.annotations" (dict "annotations" .Values.ingress.annotations "context" $) }}
  annotations: {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.ingressClassName }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  rules:
    {{- if .Values.ingress.hostname }}
    - host: {{ .Values.ingress.hostname | quote }}
      http:
        paths:
          {{- with .Values.ingress.extraPaths }}
          {{- include "generic-app.tplvalues.render" (dict "value" . "context" $) | nindent 10 }}
          {{- end }}
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "generic-app.fullname" . }}
                port:
                  name: {{ $portName }}
    {{- end }}
    {{- range .Values.ingress.extraHosts }}
    - host: {{ .name | quote }}
      http:
        paths:
          - path: {{ default "/" .path }}
            pathType: {{ default $.Values.ingress.pathType .pathType }}
            backend:
              service:
                name: {{ include "generic-app.fullname" $ }}
                port:
                  name: {{ $portName }}
    {{- end }}
    {{- with .Values.ingress.extraRules }}
    {{- include "generic-app.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
  {{- if or .Values.ingress.tls .Values.ingress.extraTls }}
  tls:
    {{- if .Values.ingress.tls }}
    - hosts:
        - {{ .Values.ingress.hostname | quote }}
      secretName: {{ printf "%s-tls" .Values.ingress.hostname }}
    {{- end }}
    {{- with .Values.ingress.extraTls }}
    {{- include "generic-app.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
