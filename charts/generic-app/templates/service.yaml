{{- if .Values.service.enabled }}
{{- if and (not .Values.service.ports) (not .Values.service.extraPorts) }}
{{- fail "service.enabled is true but service.ports is empty: declare the port(s) to expose, e.g. --set service.ports.http=8080" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "generic-app.fullname" . }}
  namespace: {{ include "generic-app.namespace" . | quote }}
  labels: {{- include "generic-app.labels" . | nindent 4 }}
  {{- with include "generic-app.annotations" (dict "annotations" .Values.service.annotations "context" $) }}
  annotations: {{- . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if and .Values.service.clusterIP (eq .Values.service.type "ClusterIP") }}
  clusterIP: {{ .Values.service.clusterIP }}
  {{- end }}
  {{- if or (eq .Values.service.type "LoadBalancer") (eq .Values.service.type "NodePort") }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy | quote }}
  {{- end }}
  {{- if and (eq .Values.service.type "LoadBalancer") .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges: {{- toYaml .Values.service.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  {{- if and (eq .Values.service.type "LoadBalancer") .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.service.loadBalancerIP }}
  {{- end }}
  {{- with .Values.service.sessionAffinity }}
  sessionAffinity: {{ . }}
  {{- end }}
  {{- with .Values.service.sessionAffinityConfig }}
  sessionAffinityConfig: {{- include "generic-app.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
  ports:
    {{- range $name, $port := .Values.service.ports }}
    {{- if not (kindIs "invalid" $port) }}
    - name: {{ $name }}
      port: {{ $port }}
      targetPort: {{ $name }}
      protocol: TCP
      {{- if or (eq $.Values.service.type "NodePort") (eq $.Values.service.type "LoadBalancer") }}
      {{- with (index ($.Values.service.nodePorts | default dict) $name) }}
      nodePort: {{ . }}
      {{- end }}
      {{- end }}
    {{- end }}
    {{- end }}
    {{- with .Values.service.extraPorts }}
    {{- include "generic-app.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
  selector: {{- include "generic-app.selectorLabels" . | nindent 4 }}
{{- end }}
