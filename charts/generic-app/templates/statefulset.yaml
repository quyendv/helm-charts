{{- if eq .Values.kind "StatefulSet" }}
apiVersion: {{ include "generic-app.workload.apiVersion" . }}
kind: StatefulSet
metadata:
  name: {{ include "generic-app.fullname" . }}
  namespace: {{ include "generic-app.namespace" . | quote }}
  labels: {{- include "generic-app.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  serviceName: {{ include "generic-app.fullname" . }}-headless
  {{- if .Values.updateStrategy }}
  updateStrategy: {{- toYaml .Values.updateStrategy | nindent 4 }}
  {{- end }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) .Values.persistence.persistentVolumeClaimRetentionPolicy }}
  persistentVolumeClaimRetentionPolicy: {{- toYaml .Values.persistence.persistentVolumeClaimRetentionPolicy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels: {{- include "generic-app.selectorLabels" . | nindent 6 }}
  template: {{- include "generic-app.podTemplate" . | nindent 4 }}
  {{- if or (and .Values.persistence.enabled (not .Values.persistence.existingClaim)) .Values.persistence.extraVolumeClaimTemplates }}
  volumeClaimTemplates:
    {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
    - metadata:
        name: data
        labels: {{- include "generic-app.labels" . | nindent 10 }}
        {{- if .Values.persistence.annotations }}
        annotations: {{- toYaml .Values.persistence.annotations | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
        {{- range .Values.persistence.accessModes }}
          - {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
        {{ include "generic-app.storageClass" . }}
        {{- if .Values.persistence.selector }}
        selector: {{- toYaml .Values.persistence.selector | nindent 10 }}
        {{- end -}}
        {{- if .Values.persistence.dataSource }}
        dataSource: {{- toYaml .Values.persistence.dataSource | nindent 10 }}
        {{- end }}
    {{- end }}
    {{- if .Values.persistence.extraVolumeClaimTemplates }}
    {{- include "generic-app.tplvalues.render" (dict "value" .Values.persistence.extraVolumeClaimTemplates "context" $) | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}

