{{- if eq .Values.kind "StatefulSet" }}
{{- $dataClaimTemplate := and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "generic-app.fullname" . }}
  namespace: {{ include "generic-app.namespace" . | quote }}
  labels: {{- include "generic-app.labels" . | nindent 4 }}
  {{- with include "generic-app.annotations" (dict "context" $) }}
  annotations: {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  serviceName: {{ include "generic-app.headlessServiceName" . }}
  {{- with .Values.updateStrategy }}
  updateStrategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  minReadySeconds: {{ .Values.minReadySeconds }}
  {{- if and (or $dataClaimTemplate .Values.persistence.extraVolumeClaimTemplates) .Values.persistence.persistentVolumeClaimRetentionPolicy }}
  persistentVolumeClaimRetentionPolicy: {{- toYaml .Values.persistence.persistentVolumeClaimRetentionPolicy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels: {{- include "generic-app.selectorLabels" . | nindent 6 }}
  template: {{- include "generic-app.podTemplate" . | nindent 4 }}
  {{- if or $dataClaimTemplate .Values.persistence.extraVolumeClaimTemplates }}
  volumeClaimTemplates:
    {{- if $dataClaimTemplate }}
    - metadata:
        name: data
        {{- /*
        volumeClaimTemplates cannot be changed after creation, so this carries only
        the selector labels: the full label set includes the chart version, which
        made every chart upgrade fail on a StatefulSet with persistence.
        */}}
        labels: {{- include "generic-app.selectorLabels" . | nindent 10 }}
        {{- with .Values.persistence.annotations }}
        annotations: {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
        {{- range .Values.persistence.accessModes }}
          - {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
        {{- with include "generic-app.storageClass" . }}
        {{ . }}
        {{- end }}
        {{- with .Values.persistence.selector }}
        selector: {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.persistence.dataSource }}
        dataSource: {{- toYaml . | nindent 10 }}
        {{- end }}
    {{- end }}
    {{- with .Values.persistence.extraVolumeClaimTemplates }}
    {{- include "generic-app.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
