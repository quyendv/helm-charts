{{- if .Values.gatewayApi.enabled }}
{{- if not .Values.gatewayApi.httpRoute.parentRefs }}
{{- fail "gatewayApi.httpRoute.parentRefs is required when gatewayApi.enabled is true" }}
{{- end }}
{{- if not .Values.service.enabled }}
{{- fail "service.enabled must be true when gatewayApi.enabled is true (HTTPRoute targets the chart Service)" }}
{{- end }}
{{- $portName := "" }}
{{- if not .Values.gatewayApi.httpRoute.rules }}
{{- $portName = include "generic-app.service.portName" (dict "port" .Values.gatewayApi.httpRoute.servicePort "field" "gatewayApi.httpRoute.servicePort" "context" $) }}
{{- end }}
apiVersion: {{ include "generic-app.gatewayApi.httpRoute.apiVersion" . }}
kind: HTTPRoute
metadata:
  name: {{ include "generic-app.gatewayApi.httpRoute.resourceName" . | quote }}
  namespace: {{ include "generic-app.namespace" . | quote }}
  labels: {{- include "generic-app.labels" . | fromYaml | merge (.Values.gatewayApi.httpRoute.labels | default dict | deepCopy) | toYaml | nindent 4 }}
  {{- with include "generic-app.annotations" (dict "annotations" .Values.gatewayApi.httpRoute.annotations "context" $) }}
  annotations: {{- . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
{{- toYaml .Values.gatewayApi.httpRoute.parentRefs | nindent 4 }}
  {{- with include "generic-app.gatewayApi.hostnames" . | fromJsonArray }}
  hostnames:
    {{- range . }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    {{- if .Values.gatewayApi.httpRoute.rules }}
    {{- include "generic-app.tplvalues.render" (dict "value" .Values.gatewayApi.httpRoute.rules "context" $) | nindent 4 }}
    {{- else }}
    - matches:
        - path:
            type: {{ .Values.gatewayApi.httpRoute.path.type }}
            value: {{ .Values.gatewayApi.httpRoute.path.value | quote }}
      {{- if (include "generic-app.gatewayApi.nginxGatewayFabric.injectSnippetExtensionRef" .) }}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.nginx.org
            kind: SnippetsFilter
            name: {{ include "generic-app.gatewayApi.nginxGatewayFabric.snippetsFilterName" . | quote }}
      {{- end }}
      {{- if .Values.gatewayApi.httpRoute.timeouts }}
      timeouts: {{- include "generic-app.tplvalues.render" (dict "value" .Values.gatewayApi.httpRoute.timeouts "context" $) | nindent 8 }}
      {{- end }}
      backendRefs:
        # group, kind and weight are the Gateway API schema defaults for a Service backend. They
        # are emitted explicitly because the API server fills them in on the stored object, so a
        # manifest that omits them never matches what is running: GitOps tools that diff desired
        # against live report the route as permanently drifted. The alternative - telling the tool
        # to ignore these paths - is worse, because ignore rules that point inside an array element
        # can mask real changes to the other fields of that same element.
        - group: ""
          kind: Service
          name: {{ include "generic-app.fullname" . }}
          port: {{ index .Values.service.ports $portName }}
          weight: 1
    {{- end }}
    {{- if .Values.gatewayApi.httpRoute.extraRules }}
    {{- include "generic-app.tplvalues.render" (dict "value" .Values.gatewayApi.httpRoute.extraRules "context" $) | nindent 4 }}
    {{- end }}
{{- end }}
