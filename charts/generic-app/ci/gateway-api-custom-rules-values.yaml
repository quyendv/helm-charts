# Gateway API with user-supplied rules (block-scalar style so ports stay integers).
image:
  repository: nginx
  tag: "1.27.3"
service:
  enabled: true
  ports:
    http: 8080
gatewayApi:
  enabled: true
  httpRoute:
    parentRefs:
      - name: internal
    rules: |
      - matches:
          - path:
              type: PathPrefix
              value: /api
        backendRefs:
          - name: {{ include "generic-app.fullname" . | quote }}
            port: {{ .Values.service.ports.http }}
