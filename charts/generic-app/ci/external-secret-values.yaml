# Secrets from an external store plus a namespaced ACME issuer.
image:
  repository: nginx
  tag: "1.27.3"
externalSecret:
  enabled: true
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: apps/api
        property: db_password
extraEnvVarsSecrets:
  - '{{ include "generic-app.fullname" . }}'
certManager:
  enabled: true
  issuerType: Issuer
  acme:
    email: ops@example.com
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
