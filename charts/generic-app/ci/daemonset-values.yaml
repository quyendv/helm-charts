# Node agent: DaemonSet, no Service, host-level scheduling knobs.
kind: DaemonSet
image:
  repository: fluent/fluent-bit
  tag: "3.1.9"
service:
  enabled: false
nodeAffinityPreset:
  type: hard
  key: kubernetes.io/os
  values: ["linux"]
tolerations:
  - operator: Exists
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
extraVolumes:
  - name: varlog
    hostPath:
      path: /var/log
extraVolumeMounts:
  - name: varlog
    mountPath: /var/log
    readOnly: true
