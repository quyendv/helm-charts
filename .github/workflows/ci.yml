name: CI

on:
  # Run on every PR so required status checks always report (a path-filtered
  # trigger would leave PRs that don't touch charts/** stuck "pending").
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'charts/**'

env:
  KUBECONFORM_VERSION: v0.7.0
  HELM_UNITTEST_VERSION: v1.2.1

jobs:
  docs:
    name: README in sync with values.yaml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check docs are up to date
        run: make docs-check

  version:
    name: Version bump and changelog
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed charts are releasable
        run: make version-check BASE_REF=origin/${{ github.base_ref }}

  test:
    name: Test (Helm ${{ matrix.helm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Users run either major; the values schema and templates must work on both.
        helm: [v3.22.0, v4.2.0]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ matrix.helm }}

      - name: Install kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Install helm-unittest
        run: |
          # Helm 4 verifies plugin signatures by default; helm-unittest is not signed.
          verify=""
          case "${{ matrix.helm }}" in v4*) verify="--verify=false" ;; esac
          helm plugin install https://github.com/helm-unittest/helm-unittest --version "$HELM_UNITTEST_VERSION" $verify

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make unittest

      - name: Validate rendered manifests
        run: make kubeconform
