name: Release Charts

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      # The landing page is deployed by the last step; skip_existing makes the release a no-op.
      - 'index.html'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.22.0

      - name: Run chart-releaser
        id: cr
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        with:
          charts_dir: charts
          skip_existing: true

      # chart-releaser can only use the chart description (or a whole file) as
      # the release body, so replace it with this version's CHANGELOG section.
      - name: Publish release notes from CHANGELOG
        if: steps.cr.outputs.changed_charts != ''
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          CHANGED_CHARTS: ${{ steps.cr.outputs.changed_charts }}
        run: |
          # changed_charts lists every chart touched since the last tag, not only the
          # ones released now, and the releases are already public at this point:
          # report problems as warnings rather than failing the rest of the job.
          for chart_dir in ${CHANGED_CHARTS//,/ }; do
            [ -f "$chart_dir/Chart.yaml" ] || continue
            name="$(awk '/^name:/ {print $2; exit}' "$chart_dir/Chart.yaml")"
            version="$(awk '/^version:/ {print $2; exit}' "$chart_dir/Chart.yaml")"
            if ! ./scripts/release-notes.sh "$chart_dir" "$version" > "$RUNNER_TEMP/release-notes.md"; then
              echo "::warning::No CHANGELOG section for $name $version; release notes left unchanged"
              continue
            fi
            if gh release edit "$name-$version" --notes-file "$RUNNER_TEMP/release-notes.md"; then
              echo "Release notes published for $name-$version"
            else
              echo "::warning::Could not update the release notes of $name-$version"
            fi
          done

      - name: Deploy index.html to gh-pages
        run: |
          git fetch origin gh-pages
          git checkout gh-pages
          git checkout ${{ github.ref_name }} -- index.html
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update landing page from ${{ github.ref_name }}"
            git push origin gh-pages
          else
            echo "No changes to index.html"
          fi
          git checkout ${{ github.ref_name }}
